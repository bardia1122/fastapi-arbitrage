global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "arbitrage-app"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["app:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]
